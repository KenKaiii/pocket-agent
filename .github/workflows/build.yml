name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Rebuild native modules for Node.js tests
        run: npm rebuild better-sqlite3

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  build-mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Import certificates
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Build and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build && npx electron-builder --mac --arm64 --x64 -p never

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: mac-build
          # A handoff to the release job below, nothing more: once that job has
          # attached these to the GitHub Release they are dead weight, and the
          # release assets are stored separately. On the default 90-day
          # retention nine of these builds accumulated 22 GB and exhausted the
          # account's artifact storage quota, which silently blocked artifact
          # uploads across every other repo.
          retention-days: 1
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml

  build-win:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build and package
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run build && npx electron-builder --win --x64 --arm64 -p never

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: win-build
          # Same handoff-only role as mac-build above; see that comment.
          retention-days: 1
          path: |
            release/*-setup.exe
            release/*.zip
            release/latest.yml

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v7
        with:
          name: mac-build
          path: release/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: win-build
          path: release/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*-setup.exe
            release/latest-mac.yml
            release/latest.yml
          body: |
            ## Pocket Agent ${{ github.ref_name }}

            A persistent personal AI assistant with memory and scheduling.

            ### Downloads

            | Platform | Architecture | File |
            |----------|--------------|------|
            | macOS | Apple Silicon (M1/M2/M3/M4) | `Pocket-Agent-*-arm64-mac.dmg` |
            | macOS | Intel | `Pocket-Agent-*-x64-mac.dmg` |
            | Windows | x64 | `Pocket-Agent-*-x64-setup.exe` |
            | Windows | ARM64 | `Pocket-Agent-*-arm64-setup.exe` |

            ### Installation

            **macOS:**
            1. Download the DMG for your Mac
            2. Open the DMG and drag Pocket Agent to Applications
            3. Launch and enter your Anthropic API key

            **Windows:**
            1. Download the setup .exe for your architecture
            2. Run the installer (you may need to click "More info" → "Run anyway" if unsigned)
            3. Launch Pocket Agent and enter your Anthropic API key
